<h1>Dashboard</h1>

<app-simple-table
  [columns]="columns()"
  [processes]="processes"
  (rowClicked)="showDetails($event)"
>
</app-simple-table>
<ng-template #actionCell let-row>
  <button mat-raised-button (click)="goToTask(row); $event.stopPropagation()">
    Go to Task
  </button>
</ng-template>
<app-counter></app-counter>
