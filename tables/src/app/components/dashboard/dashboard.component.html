<h1>Dashboard</h1>

<mat-form-field appearance="outline">
  <mat-label>Search</mat-label>
  <input
    matInput
    placeholder="Search processes"
    (keyup)="applyFilter($event)"
  />
</mat-form-field>
<table mat-table matSort [dataSource]="dataSource">
  <ng-container matColumnDef="bcmUnit">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>BCM Unit</th>
    <td mat-cell *matCellDef="let process">
      {{ process.bcmUnit }}
    </td>
  </ng-container>
  <ng-container matColumnDef="e2eAdonisId">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>Adonis ID</th>
    <td mat-cell *matCellDef="let process">
      {{ process.e2eAdonisId }}
    </td>
  </ng-container>
  <ng-container matColumnDef="processName">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>ProcessName</th>
    <td mat-cell *matCellDef="let process">
      {{ process.processName }}
    </td>
  </ng-container>
  <ng-container matColumnDef="bcmClass">
    <th mat-header-cell mat-sort-header *matHeaderCellDef>BCM Class</th>
    <td mat-cell *matCellDef="let process">
      {{ process.bcmClass }}
    </td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let process">
      <button
        mat-raised-button
        [disabled]="process.bcmClass === 'Class 3'"
        (click)="goToTask(process)"
      >
        Go to Task
      </button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
<mat-paginator
  [pageSize]="5"
  [pageSizeOptions]="pageSizeOptions"
  showFirstLastButtons
></mat-paginator>
